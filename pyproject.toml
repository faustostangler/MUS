[project]
name = "mus"
version = "0.1.0"
description = "Source-filter vocal decomposition, modulation and resynthesis pipeline (ADR-001)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pyworld>=0.3.4",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pretty_midi>=0.2.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "setuptools<70",
]

[project.optional-dependencies]
legacy = ["demucs", "yt-dlp", "torch", "tqdm"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mutmut>=3",
    "ruff>=0.5",
    "mypy>=1.10",
    "polyfactory>=2.16",
]

[project.scripts]
mus = "mus.presentation.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: uses real third-party libraries (pyworld, soundfile, pretty_midi)",
    "external: requires external binaries (fluidsynth, musescore, basic-pitch)",
    "e2e: CLI end-to-end",
    "slow: performance budget tests",
]
addopts = "-m 'not external and not slow' --strict-markers"

[tool.coverage.run]
source = ["src/mus"]
branch = true

[tool.mutmut]
paths_to_mutate = [
    "src/mus/shared_kernel/",
    "src/mus/voice_modeling/domain/",
    "src/mus/voice_modeling/application/",
    "src/mus/music_transcription/domain/",
    "src/mus/music_transcription/application/",
    "src/mus/instrument_rendering/domain/",
    "src/mus/instrument_rendering/application/",
    "src/mus/config.py",
]
tests_dir = ["tests/"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "sandbox", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D", "ANN", "PL", "NPY"]
ignore = ["D100", "D104", "D105", "D107", "PLR2004", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004", "S101"]
"src/mus/presentation/cli/**" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["legacy/", "sandbox/", ".agents/"]

[[tool.mypy.overrides]]
module = ["pyworld.*", "soundfile.*", "librosa.*", "pretty_midi.*", "scipy.*"]
ignore_missing_imports = true
